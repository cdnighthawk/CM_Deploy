<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USIS new-hire packet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;650;700&display=swap" rel="stylesheet">
  <style>
    :root{--usis-primary:#1E4B8F;--usis-primary-dark:#163A6E;--usis-stamp:#C8102E;--usis-bg:#F4F6F8;--usis-paper:#fff;--usis-text:#1B242C;--usis-muted:#5C6B73;--usis-line:#E3E8EE}
    body.usis-public-hire{font-family:"Source Sans 3",system-ui,sans-serif;background:var(--usis-bg);color:var(--usis-text);margin:0}
    .usis-public-rfp-header{background:var(--usis-paper);border-bottom:1px solid var(--usis-line);border-top:3px solid var(--usis-stamp);padding:12px 16px}
    .usis-wordmark{font-weight:650;letter-spacing:-0.01em}
    .usis-wordmark__worx{color:var(--usis-primary)}
    .usis-wordmark__cm{color:var(--usis-stamp)}
    .wrap{max-width:40rem;margin:0 auto;padding:16px}
    .card-like{background:var(--usis-paper);border:1px solid var(--usis-line);border-radius:10px;padding:16px}
    h1{font-size:1.25rem;font-weight:650;margin:0 0 .35rem}
    h2{font-size:1rem;font-weight:650;margin:0 0 .75rem;color:var(--usis-primary)}
    .muted{color:var(--usis-muted);font-size:.8125rem}
    .btn-primary{background:var(--usis-primary);border-color:var(--usis-primary);font-weight:600;border-radius:8px}
    .btn-primary:hover,.btn-primary:focus{background:var(--usis-primary-dark);border-color:var(--usis-primary-dark)}
    .btn-outline-primary{color:var(--usis-primary);border-color:var(--usis-primary);font-weight:600;border-radius:8px}
    .form-control,.form-select{font-size:.9rem;border-radius:8px}
    .steps{display:flex;gap:4px;margin:0 0 12px;flex-wrap:wrap}
    .steps span{height:6px;flex:1;min-width:28px;background:var(--usis-line);border-radius:99px}
    .steps span.on{background:var(--usis-primary)}
    #sig-pad{width:100%;height:140px;border:1px solid var(--usis-line);border-radius:8px;background:#fff;touch-action:none}
    .preview-frame{width:100%;height:280px;border:1px solid var(--usis-line);border-radius:8px;background:#fff}
    label.form-label{font-size:.8rem;font-weight:600}
    .err{color:#8a1f11;font-size:.85rem}
  </style>
</head>
<body class="usis-public-hire" data-hire-token="{{ token }}">
  <header class="usis-public-rfp-header d-flex justify-content-between align-items-center gap-2">
    <strong class="usis-wordmark"><span class="usis-wordmark__worx">WorX</span> <span class="usis-wordmark__cm">CM</span></strong>
    <span class="muted">New-hire packet</span>
  </header>
  <div class="wrap">
    <div id="hire-root" class="card-like">Loading…</div>
  </div>
  <script src="/static/public/hire-wizard.js"></script>
</body>
</html>
