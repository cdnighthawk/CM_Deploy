# Render Blueprint — USIS CM (Flask API + Gulp static shell + PostgreSQL)
# Dashboard: New > Blueprint > connect GitHub repo > apply this file.
# After first deploy: set SECRET_KEY, TOKEN_ENCRYPTION_KEY, BOOTSTRAP_ADMIN_* in the dashboard,
# then run ``python scripts/create_bootstrap_admin.py`` in the Render Shell.

databases:
  - name: usis-cm-db
    databaseName: usis_cm
    user: usis_app
    plan: basic-256mb

services:
  - type: web
    name: usis-cm
    runtime: python
    # Starter (512 MB) + one sync worker cannot answer /healthz while the
    # 5-minute invoice-mailbox cron holds the worker (up to 70s). That is
    # Instance failed. Standard is 2 GB. Keep 1 worker; threads let health
    # checks through. Do not set WEB_CONCURRENCY=2 until RAM is confirmed.
    plan: standard
    rootDir: backend
    buildCommand: >-
      (cd ../W3CRM-v3.0-13_September_2025/gulp && npm ci && npx gulp build) || true;
      pip install -r requirements.txt
    # Redeploy trigger: mailbox cron must not block /healthz (2026-09-19)
    preDeployCommand: flask db upgrade
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --threads ${WEB_THREADS:-4} --timeout 180
    healthCheckPath: /healthz
    disk:
      name: usis-instance
      mountPath: /opt/render/project/src/backend/instance
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FLASK_APP
        value: app:create_app
      - key: FLASK_ENV
        value: production
      - key: WEB_THREADS
        value: "4"
      - key: USIS_BOOTSTRAP_LEADS_ON_STARTUP
        value: "0"
      - key: USIS_ALLOW_SELF_REGISTER
        value: "1"
      - key: USIS_ALLOW_COMPANY_SELF_SIGNUP
        value: "0"
      - key: USIS_APP_PUBLIC_URL
        value: https://www.usiscm.com
      - key: USIS_API_DEV_ALLOW_ANY
        value: "0"
      - key: USIS_STATIC_ROOT
        value: ../W3CRM-v3.0-13_September_2025/gulp/dist
      - key: DATABASE_URL
        fromDatabase:
          name: usis-cm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: USIS_AI_ENABLED
        value: "1"
      - key: USIS_XAI_MODEL
        value: grok-4.6
      - key: USIS_XAI_BASE_URL
        value: https://api.x.ai/v1
      - key: USIS_AI_MAX_TOOL_ROUNDS
        value: "8"
      - key: USIS_AI_REQUEST_TIMEOUT_SEC
        value: "120"
      - key: USIS_XAI_API_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: BC_SYNC_CRON_SECRET
        sync: false
      - key: BUILDINGCONNECTED_SYNC_ENABLED
        value: "1"
      # Autodesk Desktop Connector ingest agent (Bearer token for /api/projects etc.).
      - key: CM_API_KEY
        sync: false
      # On-prem estimate folder agent (C:\usis-cm\folder_provision.py on port 5055, root Y:\Estimates).
      # Set a URL Render can reach (not 127.0.0.1). Do not set ESTIMATE_FOLDER_ROOT on Render.
      - key: ESTIMATE_FOLDER_PROVISION_URL
        sync: false
      - key: ESTIMATE_FOLDER_PROVISION_TOKEN
        sync: false
      # Backblaze B2 — set in Render Dashboard (see docs/backblaze-b2.md).
      # Use B2_PREFIX=prod/usis-cm on Render; dev machines use dev/usis-cm in backend/.env.
      - key: B2_APPLICATION_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        value: USIS-construction-docs
      - key: B2_ENDPOINT
        sync: false
      - key: B2_PREFIX
        value: prod/usis-cm
      # Optional. Skips b2_list_buckets for native b2_get_upload_url mint.
      - key: B2_BUCKET_ID
        sync: false
      - key: QUOTES_MAILBOX
        value: quotes@gousis.com
      - key: INVOICE_MAILBOX
        value: invoices@gousis.com

  - type: cron
    name: usis-invoice-mailbox-sync
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: echo skip
    startCommand: python scripts/trigger_invoice_mailbox_sync.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BC_SYNC_CRON_SECRET
        fromService:
          name: usis-cm
          type: web
          envVarKey: BC_SYNC_CRON_SECRET
      - key: USIS_WEB_HOSTPORT
        fromService:
          name: usis-cm
          type: web
          property: hostport
      - key: INVOICE_MAILBOX_SYNC_URL
        value: https://www.usiscm.com/api/v1/ap/mailbox/sync

  - type: cron
    name: usis-calendar-reminders
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 14 * * *"
    buildCommand: echo skip
    startCommand: python scripts/trigger_daily_calendar_reminders.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BC_SYNC_CRON_SECRET
        fromService:
          name: usis-cm
          type: web
          envVarKey: BC_SYNC_CRON_SECRET
      - key: CALENDAR_REMINDER_URL
        value: https://www.usiscm.com/api/v1/integrations/calendar-reminders/run

  - type: cron
    name: usis-bc-hourly-sync
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: echo skip
    startCommand: python scripts/trigger_hourly_bc_sync.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BC_SYNC_CRON_SECRET
        fromService:
          name: usis-cm
          type: web
          envVarKey: BC_SYNC_CRON_SECRET
      - key: BC_SYNC_URL
        value: https://www.usiscm.com/api/v1/integrations/buildingconnected/sync
